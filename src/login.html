<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Access Portal</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-md mx-auto bg-white rounded-lg shadow-md overflow-hidden">
            <div class="bg-gradient-to-r from-mpesa-green to-mpesa-darkgreen p-4 text-white">
                <h1 class="text-2xl font-bold text-center">WiFi Internet Access</h1>
            </div>
            
            <div class="p-6">
                <div class="mb-6">
                    <p class="text-gray-600 text-center">Select a package and pay with M-Pesa to access the internet</p>
                </div>
                
                <form id="access-form" class="space-y-6">
                    <div class="space-y-3 border rounded-md p-4 bg-gray-50">
                        <div class="flex items-center border-b pb-3">
                            <input type="radio" id="hourly" name="package" value="hourly" class="h-4 w-4 text-mpesa-green" checked>
                            <label for="hourly" class="ml-3 flex justify-between w-full">
                                <span class="font-medium text-gray-700">1 Hour Access</span>
                                <span class="font-bold">KSh 50</span>
                            </label>
                        </div>
                        
                        <div class="flex items-center border-b pb-3 pt-2">
                            <input type="radio" id="daily" name="package" value="daily" class="h-4 w-4 text-mpesa-green">
                            <label for="daily" class="ml-3 flex justify-between w-full">
                                <span class="font-medium text-gray-700">24 Hour Access</span>
                                <span class="font-bold">KSh 100</span>
                            </label>
                        </div>
                        
                        <div class="flex items-center pt-2">
                            <input type="radio" id="weekly" name="package" value="weekly" class="h-4 w-4 text-mpesa-green">
                            <label for="weekly" class="ml-3 flex justify-between w-full">
                                <span class="font-medium text-gray-700">7 Day Access</span>
                                <span class="font-bold">KSh 500</span>
                            </label>
                        </div>
                    </div>

                    <div class="p-4 border rounded-md">
                        <div class="flex items-center mb-4">
                            <div class="w-8 h-8 mr-3">
                                <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <rect width="48" height="48" rx="8" fill="#4CAF50"/>
                                    <path d="M24 10C16.268 10 10 16.268 10 24C10 31.732 16.268 38 24 38C31.732 38 38 31.732 38 24C38 16.268 31.732 10 24 10ZM29 25.5H25.5V29C25.5 29.55 25.05 30 24.5 30H23.5C22.95 30 22.5 29.55 22.5 29V25.5H19C18.45 25.5 18 25.05 18 24.5V23.5C18 22.95 18.45 22.5 19 22.5H22.5V19C22.5 18.45 22.95 18 23.5 18H24.5C25.05 18 25.5 18.45 25.5 19V22.5H29C29.55 22.5 30 22.95 30 23.5V24.5C30 25.05 29.55 25.5 29 25.5Z" fill="white"/>
                                </svg>
                            </div>
                            <h3 class="text-lg font-semibold">Pay with M-Pesa</h3>
                        </div>
                        
                        <div class="space-y-4">
                            <div>
                                <label for="phone-number" class="block text-sm font-medium text-gray-700">Phone Number</label>
                                <input type="tel" id="phone-number" name="phoneNumber" placeholder="07XXXXXXXX" class="input" required>
                                <p class="text-xs text-gray-500 mt-1">Enter your M-Pesa registered phone number</p>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-full flex items-center justify-center">
                                <span>Pay Now</span>
                            </button>
                        </div>
                    </div>
                </form>
                
                <!-- Payment status section -->
                <div id="payment-status" class="mt-6">
                    <div id="error-message" class="text-red-600 text-sm text-center hidden"></div>
                    <div id="success-message" class="text-green-600 text-sm text-center hidden"></div>
                    
                    <div id="loading" class="flex flex-col items-center py-4 hidden">
                        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-mpesa-green"></div>
                        <p class="mt-2 text-sm text-gray-600">Processing your payment...</p>
                    </div>
                </div>
                
                <!-- M-Pesa confirmation section -->
                <div id="mpesa-confirm" class="mt-6 border-t pt-4 hidden">
                    <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-4">
                        <div class="flex">
                            <div class="flex-shrink-0">
                                <svg class="h-5 w-5 text-yellow-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                                </svg>
                            </div>
                            <div class="ml-3">
                                <p class="text-sm text-yellow-700">Check your phone for the M-Pesa prompt and enter your PIN to complete the payment.</p>
                            </div>
                        </div>
                    </div>
                    
                    <button id="check-payment" class="btn btn-primary w-full">I've Completed the Payment</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="assets/js/payment.js"></script>
</body>
</html>
